<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="softCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <pattern id="islamicPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M20 0 L40 20 L20 40 L0 20 Z" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <circle cx="20" cy="20" r="8" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="400" height="480" fill="url(#bgGrad)"/>
  <rect width="400" height="480" fill="url(#islamicPattern)"/>

  <!-- Halo Ring -->
  <circle cx="200" cy="180" r="110" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="6,4" opacity="0.6"/>
  <circle cx="200" cy="180" r="95" fill="url(#softCard)"/>

  <!-- Islamic Educator / Hijab Silhouette -->
  <!-- Hijab Drape Base -->
  <path d="M120 380 C120 300, 150 250, 170 240 C160 225, 155 205, 155 180 C155 130, 175 105, 200 105 C225 105, 245 130, 245 180 C245 205, 240 225, 230 240 C250 250, 280 300, 280 380 Z" fill="#ffffff" opacity="0.95"/>
  
  <!-- Face Oval -->
  <ellipse cx="200" cy="185" rx="35" ry="42" fill="#fcd34d" opacity="0.9"/>
  <path d="M165 180 C165 140, 180 125, 200 125 C220 125, 235 140, 235 180 C235 195, 225 210, 200 215 C175 210, 165 195, 165 180 Z" fill="#fef3c7"/>
  
  <!-- Scarf / Veil folds -->
  <path d="M165 160 C180 145, 220 145, 235 160 C245 200, 240 250, 200 270 C160 250, 155 200, 165 160 Z" fill="#047857" opacity="0.25"/>
  <path d="M185 240 L200 265 L215 240 Z" fill="#d97706" opacity="0.8"/>
  
  <!-- Shoulders / Islamic Blazer -->
  <path d="M100 480 C100 390, 140 340, 175 325 L200 355 L225 325 C260 340, 300 390, 300 480 Z" fill="#022c22"/>
  <path d="M175 325 L200 385 L225 325" fill="#f8fafc"/>
  <path d="M192 345 L200 355 L208 345 Z" fill="#d97706"/>

  <!-- Badge Emblem Frame -->
  <g transform="translate(40, 390)">
    <rect width="320" height="70" rx="14" fill="#ffffff" filter="drop-shadow(0 6px 16px rgba(0,0,0,0.25))"/>
    <rect x="3" y="3" width="314" height="64" rx="11" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="36" cy="35" r="20" fill="#ecfdf5"/>
    <path d="M36 24 L42 27 L42 34 C42 38, 39 42, 36 44 C33 42, 30 38, 30 34 L30 27 Z" fill="#047857"/>
    <text x="70" y="31" font-family="'Poppins', sans-serif" font-size="13" font-weight="700" fill="#064e3b">Ririn Kartika Sari Dalimunthe, S.Pd.I</text>
    <text x="70" y="49" font-family="'Poppins', sans-serif" font-size="11" font-weight="500" fill="#64748b">Kepala Sekolah &bull; NUPTK: 3552767669130143</text>
  </g>
</svg>
